##############################################
#                                            #
#        Xdfile Manager Configuration        #
#                                            #
##############################################

# This contains the root config file for Xdfile Manager.
# Customize it to match your Xdfile Manager workflow.
#
# Runtime support note:
# The current TUI runtime only honors these stable fields:
#   theme, default_directory, default_open_file_preview, show_image_preview,
#   enable_file_preview_border, nerdfont, zoxide_support, ai_enabled,
#   ai_provider, ai_model, ai_api_key_env.
# Other fields are kept as legacy/reserved configuration until they are
# explicitly connected by a roadmap task.

###############################################################################
#                                   Defaults                                  #
###############################################################################

#-- File Editor
# Default: $EDITOR
editor = ""

#-- Directory Editor
# 
dir_editor = ""

#-- Auto check for update

#-- cd on quit
# Should we cd the shell to the last directory open in Xdfile Manager when the
# program exits? 
cd_on_quit = false

#-- File Preview
# Should we open a file preview by default whenever selection-hovering over a
# file?
default_open_file_preview = false

#-- Image Preview
# Should we open an image preview by default whenever selection-hovering over an
# image?
show_image_preview = true

#-- File Info Footer
# Should we display a footer in the file panel that provides more file information?
show_panel_footer_info = true

#-- Default Directory
# The initial path that the file panel should navigate to when Xdfile Manager is
# opened. This setting understands relative paths such as ".", "..", etc.
default_directory = "."

#-- File Size Units
# true: SI decimal units of 1000 (kB, MB, GB).
# false: IEC binary units of 1024 (KiB, MiB, GiB).
file_size_use_si = false

#-- Default File Sort Type
# (0: Name, 1: Size, 2: Date Modified, 3: Type).
default_sort_type = 0

#-- Sort Order Reversing
# true: Descending.
# false: Ascending.
sort_order_reversed = false

#-- Case-Sensitive Sorting (only for Name Sort)
# An uppercase "B" comes before a lowercase "a" if true.
case_sensitive_sort = false

#-- Exit Shell on Success
# Whether to exit the shell on successful command execution.
shell_close_on_success = false

#-- Page Scroll Size
# Number of lines to scroll for PgUp/PgDown keys (0: full page, default behavior).
page_scroll_size = 0

#-- Debug Mode
debug = false

#-- Ignore Missing Config Fields
# Whether to silence any warnings about missing config fields.
ignore_missing_fields = false

#-- File Panel Extra Columns Count
# Count of extra columns in file panel in addition to file name. When option equal 0 then feature is disabled.
file_panel_extra_columns = 0

#-- File name width in File Panel
# Percentage of file panel width allocated to file names (25-100). Higher values give more space to names, less to extra columns.
file_panel_name_percent = 50


###############################################################################
#                                   Styling                                   #
###############################################################################

#-- Theme
# Put your theme's name here!
# Runtime themes: persona3, persona3reload, persona3kotone, persona4, persona5.
# TOML theme files in xdfile-theme/ are also accepted by filename without ".toml",
# for example gruvbox or catppuccin-mocha. Legacy theme fields are mapped to the
# current TUI token set with safe fallbacks rather than exposed as a full API.
theme = "persona3"

#-- Code Previewer
# Whether to use the builtin syntax highlighting with chroma or use bat. Values: "" for builtin chroma, "bat" for bat
code_previewer = ""

#-- Nerd Fonts Support
# Whether to enable support for Nerd Fonts symbols.
# Requires:  Font patched with the Nerd Fonts patch.
nerdfont = true

#-- Show checkbox icons in select mode
# Requires: nerdfont = true
show_select_icons = true

#-- Transparent Background Support
# Set to true to enable background transparency.
# Requires: terminal support for colour transparency
transparent_background = false

#-- File Preview Panel Width
# Width of the file preview panel will be 1/n of the total width.
# Values recommended to be in 2–10.
# Default (0): Use the same width as file picker panel.
file_preview_width = 0

#-- File Preview Border
# Enable border around the file preview panel for better visual separation.
# Default: false (no border)
enable_file_preview_border = false

#-- Sidebar Width
# If you don't want to display the sidebar, you can input 0 directly.
# Values recommended to be in 5–20.
sidebar_width = 20

#-- Border
# Make sure to add strings that are exactly one character wide!
# Use ' ' for borderless.
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'

###############################################################################
#                                   Plugins                                   #
###############################################################################

# This section is for plugins used by Xdfile Manager, external addons that extend
# the default capabilities of the program.

#-- Detailed Metadata
# Requires: exiftool
metadata = false

#-- Legacy MD5 Checksum Generation
# Reserved legacy option. Runtime MD5 is available on demand from Panels -> MD5
# checksum and does not read this field.
enable_md5_checksum = false
#
#-- Zoxide Support - Smart directory navigation!
# Requires: zoxide
zoxide_support = false

#-- AI command draft generation
# Disabled by default. v1 only generates an NL2Shell command draft and fills the
# terminal input; it never presses Enter automatically.
ai_enabled = false

# Provider and model are reserved for the configured provider implementation.
ai_provider = ""
ai_model = ""

# Name of the environment variable that contains the API key. The key value is
# never written to config or sent through file content context.
ai_api_key_env = ""

#-- File opening rules
# Map file extensions to commands used to open them.
# The file path will be appended as the last argument.
# MUST BE IN THE VERY END OF THE FILE BECAUSE TOML CANNOT CLOSE TABLES
# Example:
#   png = "feh"
#   pdf = "zathura"
#   conf = "nvim"
[open_with]
